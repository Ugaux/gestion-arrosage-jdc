; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ESP32-debug

[ESP32-base]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0 ; keep RTS low so opening/closing the monitor 
                ; doesn't reset the board. Also prevent RTS from
                ; floating on close, which combined with WiFi 
                ; current spikes was causing repeated resets 
monitor_dtr = 0 ; need to be low for a reset button press to work
upload_speed = 921600
board_build.filesystem = littlefs
test_build_src = no
monitor_filters =
    direct
    esp32_exception_decoder
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DPLATFORM_ESP32 
    -DCONFIG_ARDUHAL_LOG_COLORS=1
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    bblanchon/StreamUtils@^1.9.2
    xreef/PCF8574 library@^2.4.0
    adafruit/Adafruit BusIO@^1.17.4
    adafruit/RTClib@^2.1.4
    arduinogetstarted/ezButton@^1.0.6
    esp32async/ESPAsyncWebServer @^3.7.7

[env:ESP32-debug]
extends = ESP32-base
build_type = debug
build_flags =
    ${ESP32-base.build_flags}
    -DCORE_DEBUG_LEVEL=4
    -fstack-protector-strong

[env:ESP32-release]
extends = ESP32-base
build_type = release
build_flags =
    ${ESP32-base.build_flags}
    -DCORE_DEBUG_LEVEL=3

[env:ESP32-release-ota]
extends = env:ESP32-release
upload_protocol = espota
upload_port = 192.168.1.174
upload_flags = --auth=<your_ota_password>

[env:ESP32-test]
; Board only — compiles on PC and runs on ESP32
extends = ESP32-base
build_type = test
test_filter =
    embedded/*
    sanity/*
test_ignore =
    embedded/components/*
    native/*

[env:Native-test]
; No board — compiles and runs on PC
platform = native
build_type = test
test_framework = unity
lib_deps =
    throwtheswitch/Unity@^2.6.1
    bblanchon/ArduinoJson@^7.4.3
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DPLATFORM_NATIVE
    -Iinclude/native
test_build_src = true
build_src_filter =
    -<*>
    +<config/generated/*>
    +<config/runtime/JsonDeserializer.cpp>
    +<config/runtime/Validation.cpp>
    +<types/*>
test_filter =
    native/*
test_ignore =
    native/test_json
    embedded/*