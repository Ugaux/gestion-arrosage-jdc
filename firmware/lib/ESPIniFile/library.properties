sentence=Library to read and parse .ini files on ESP8266 and ESP32 platforms
paragraph=Inspired by SPIFFSIniFile from Yuri Lopes, ESPIniFile is an ESP8266/ESP32 library for opening and parsing '.ini' files via SPIFFS or LittleFS, with the added functionnality of understanding sub-sections. ESPIniFile is designed to use minimal memory requirements, and the only buffer used is one supplied by the user, thus the user remains in charge of memory usage. GNU LGPL v3
